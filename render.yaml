# Render Blueprint for the A.ai API and its daily cleanup job (ADR-017, docs/development/deployment.md).
# Values marked `sync: false` are secrets: set them in the Render dashboard, never here.
# Deploys are triggered by the GitHub "Deploy" workflow after the full gate passes (autoDeploy: false).
services:
  - type: web
    name: a-ai-api
    runtime: node
    plan: starter
    region: singapore
    # NODE_ENV=production during install would skip the build tools (TypeScript, turbo).
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm turbo run build --filter=@a-ai/api...
    # Forward-only migrations run before the new version receives traffic.
    preDeployCommand: pnpm db:deploy
    startCommand: node apps/api/dist/server.js
    # Liveness only: a Redis or database outage shows in /ready without restarting the instance.
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: a-ai-attachments
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: cron
    name: a-ai-attachments-cleanup
    runtime: node
    plan: starter
    region: singapore
    schedule: '30 3 * * *'
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile
    startCommand: pnpm attachments:cleanup
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: a-ai-attachments
