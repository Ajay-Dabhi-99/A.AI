packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts unless allow-listed.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild

# Security review D-1 (docs/development/security-review.md): patched mysql2 inside the Prisma CLI.
overrides:
  mysql2: 3.23.1
