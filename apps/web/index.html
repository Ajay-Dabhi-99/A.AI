<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.ai · Compare AI models side by side</title>
    <meta
      name="description"
      content="A.ai runs one prompt across multiple AI models in parallel and shows the latency, tokens and cost behind every answer."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply an explicit theme choice before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('a-ai-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
